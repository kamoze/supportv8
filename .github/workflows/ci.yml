name: CI & Build Validation

on:
  push:
    branches: [ main, master, codex/support-runtime-provisioning-20260915, codex/support-runtime-rbac-20260916 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: support-workspace-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Run Vitest Unit Tests
      run: npx vitest run

    - name: Rehearse Runtime Support workspace migration and RLS
      run: npx vitest run test/runtime-support-workspace.postgres.test.ts
      env:
        SUPPORTV8_REAL_POSTGRES: 1
        SUPPORTV8_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:support-workspace-test@127.0.0.1:5432/postgres

    - name: Verify Runtime Support access and ticket RLS
      run: npx vitest run test/runtime-support-access.postgres.test.ts
      env:
        SUPPORTV8_REAL_POSTGRES: 1
        SUPPORTV8_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:support-workspace-test@127.0.0.1:5432/postgres

    - name: Verify Runtime Support handoff replay and RLS
      run: npx vitest run test/runtime-support-handoff.postgres.test.ts
      env:
        SUPPORTV8_REAL_POSTGRES: 1
        SUPPORTV8_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:support-workspace-test@127.0.0.1:5432/postgres

    - name: Verify Runtime Support durable ticket writes and RLS
      run: npx vitest run test/runtime-ticket-write.postgres.test.ts
      env:
        SUPPORTV8_REAL_POSTGRES: 1
        SUPPORTV8_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:support-workspace-test@127.0.0.1:5432/postgres

    - name: Next.js Production Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        NODE_ENV: production

    - name: Verify standalone Runtime Support host and logout boundary
      run: npx vitest run test/runtime-support-next-standalone.test.ts
      env:
        SUPPORTV8_NEXT_STANDALONE_PROOF: 1
        SUPPORTV8_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:support-workspace-test@127.0.0.1:5432/postgres
