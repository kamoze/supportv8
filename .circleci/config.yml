version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.13
        environment:
          REDIS_URL: redis://:ci-supportv8-auth@127.0.0.1:6379
          SUPPORTV8_RUN_REDIS_INTEGRATION: "true"
      - image: redis:7.4-alpine
        command: ["redis-server", "--requirepass", "ci-supportv8-auth"]
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci || npm install
      - run:
          name: Run Unit and Conformance Tests
          command: npx vitest run
      - run:
          name: Build Next.js Application
          command: npm run build
  push-image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push Docker image
          command: |
            TAG="web-${CIRCLE_SHA1:0:7}"
            IMAGE="redoosolutions/supportv8"
            docker build -t "$IMAGE:$TAG" -t "$IMAGE:web-latest" .
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push "$IMAGE:$TAG"
            docker push "$IMAGE:web-latest"
  update-devops:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update ServiceV8 DevOps image tag
          command: |
            IMAGE_TAG="web-${CIRCLE_SHA1:0:7}"
            git clone "https://${GITHUB_TOKEN}@github.com/kamoze/servicev8-devops.git" devops
            cd devops
            sed -i "s|image: redoosolutions/supportv8:.*|image: redoosolutions/supportv8:$IMAGE_TAG|g" apps/supportv8/deployment.yaml
            sed -i "s|image: redoosolutions/supportv8:.*|image: redoosolutions/supportv8:$IMAGE_TAG|g" apps/supportv8/worker.yaml
            if [ -f apps/supportv8/chat-relay.yaml ]; then
              sed -i "s|image: redoosolutions/supportv8:.*|image: redoosolutions/supportv8:$IMAGE_TAG|g" apps/supportv8/chat-relay.yaml
            fi
            git config user.email "ci@servicev8.com"
            git config user.name "CircleCI Runner"
            git add apps/supportv8/deployment.yaml apps/supportv8/worker.yaml
            if [ -f apps/supportv8/chat-relay.yaml ]; then
              git add apps/supportv8/chat-relay.yaml
            fi
            git commit -m "ci: update supportv8 image tag to $IMAGE_TAG" || echo "No changes to commit"
            git remote set-url origin "https://${GITHUB_TOKEN}@github.com/kamoze/servicev8-devops.git"
            git push origin main
workflows:
  version: 2
  supportv8:
    jobs:
      - build:
          context:
            - servicev8-prod
          filters:
            branches:
              only:
                - main
                - master
      - push-image:
          context:
            - servicev8-prod
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master
      - update-devops:
          context:
            - servicev8-prod
          requires:
            - push-image
          filters:
            branches:
              only:
                - main
                - master
