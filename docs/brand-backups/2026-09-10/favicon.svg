<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A24" />
      <stop offset="100%" stop-color="#0B1017" />
    </linearGradient>

    <!-- Glowing Electric Teal Gradient -->
    <linearGradient id="teal-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#2ED8B6" />
      <stop offset="80%" stop-color="#20C997" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dot 1: Red Priority Alert -->
    <linearGradient id="dot-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E5484D" />
    </linearGradient>

    <!-- Dot 2: Amber Investigation -->
    <linearGradient id="dot-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA940" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>

    <!-- Dot 3: Emerald Autonomous Resolved -->
    <linearGradient id="dot-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="teal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2ED8B6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container App Icon Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#2ED8B6" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="27" fill="#15202E" fill-opacity="0.6" stroke="#2ED8B6" stroke-opacity="0.15" stroke-width="1" />

  <!-- supportV8 S-Chat Dynamic Ribbon Symbol -->
  <g transform="translate(0, 0) scale(0.64)">
    <path
      d="M 52 18
         C 33 18, 20 30, 20 45
         C 20 54, 25 62, 33 67
         L 22 84
         C 20.5 86.5, 23 89, 25.5 87.5
         L 42 78
         C 45.2 79.2, 48.5 80, 52 80
         C 71 80, 84 68, 84 52
         C 84 38, 73 28, 60 25
         C 45 22, 36 28, 34 36
         C 33 40, 36 43, 40 43
         C 44 43, 47 40, 48 37
         C 50 32, 55 29, 61 31
         C 69 33, 74 40, 74 50
         C 74 61, 64 70, 52 70
         C 48.5 70, 45 69, 41.5 67.5
         L 34 72
         L 39 63
         C 33.5 58.5, 30 52, 30 45
         C 30 35, 39 27, 52 27
         C 63 27, 72 33, 74 41
         C 75 44, 78.5 46, 82 44.5
         C 85.5 43, 86.5 39.5, 84.5 36
         C 79 24, 67 18, 52 18 Z"
      fill="url(#teal-flow)"
      filter="url(#teal-glow)"
    />

    <!-- 3 Triage Status Dots -->
    <circle cx="42" cy="49" r="4.2" fill="url(#dot-red)" />
    <circle cx="52" cy="49" r="4.2" fill="url(#dot-amber)" />
    <circle cx="62" cy="49" r="4.2" fill="url(#dot-green)" />
  </g>
</svg>
